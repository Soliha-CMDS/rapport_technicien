:root{
  --bg:#f3f6f8; --surface:#ffffff; --fg:#14212b; --muted:#44535f; --line:#c5d1da;
  --accent:#1b6d96; --accent-strong:#0e4a6b; --accent-ink:#ffffff; --chip:#e3eef4;
  --danger:#b42318; --danger-bg:#fbe9e7; --warn:#8a5300; --warn-bg:#fdf1dc; --ok:#1e7a47; --ok-bg:#e3f3e9;
  --paper:#ffffff; --ink:#111111;
  --f-display:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:12px; --r-sm:8px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161c; --surface:#17222a; --fg:#e8eff4; --muted:#a8b8c4; --line:#344552;
  --accent:#62b2dc; --accent-strong:#9fd0ea; --accent-ink:#08161e; --chip:#1e3340;
  --danger:#f28b7d; --danger-bg:#3a1d1a; --warn:#e8b45e; --warn-bg:#3a2c14; --ok:#6fcb98; --ok-bg:#163223;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161c; --surface:#17222a; --fg:#e8eff4; --muted:#a8b8c4; --line:#344552;
  --accent:#62b2dc; --accent-strong:#9fd0ea; --accent-ink:#08161e; --chip:#1e3340;
  --danger:#f28b7d; --danger-bg:#3a1d1a; --warn:#e8b45e; --warn-bg:#3a2c14; --ok:#6fcb98; --ok-bg:#163223;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.5rem}h2{font-size:1.25rem}h3{font-size:1.1rem}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.top .grow{flex:1;min-width:0}
.top .sub{color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .com{height:40px;width:auto;border-radius:4px;background:#fff;padding:2px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
button,.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:10px 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-icon{padding:8px;min-width:44px}
button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label.chip:focus-within{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;font-weight:700}

.visits{display:grid;gap:10px;margin-block:14px}
.visit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.visit .name{font-weight:700;font-size:1.05rem}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-align:left;display:grid;grid-template-columns:minmax(0,1fr);justify-content:stretch;gap:8px;align-content:start;min-height:128px;cursor:pointer;color:var(--fg)}
.tile .ic{width:64px;height:64px;display:block}
.tile .num{font-family:var(--f-display);color:var(--muted);font-size:.85rem;letter-spacing:.04em}
.tile .lbl{font-family:var(--f-display);font-size:1.08rem;line-height:1.15}
.pill{display:inline-block;font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--muted);justify-self:start}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.danger{background:var(--danger-bg);color:var(--danger)}.pill.info{background:var(--chip);color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bar .wrapin{max-width:860px;margin:0 auto;display:flex;gap:10px}
.bar .wrapin>*{flex:1}

.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 14px;margin-bottom:18px}
.form .full{grid-column:1/-1}
.form h3{grid-column:1/-1;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:.88rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=email],textarea,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-height:44px}
textarea{min-height:88px;resize:vertical}
textarea.big{min-height:360px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
label.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:8px 13px;min-height:40px;background:var(--surface);cursor:pointer;font-size:.95rem;line-height:1.2}
label.chip input{position:absolute;opacity:0;width:1px;height:1px}
label.chip:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.full .chips label.chip{border-radius:10px}
.hint{font-size:.85rem;color:var(--muted);background:var(--chip);border-radius:8px;padding:8px 10px}
.hint.warn{background:var(--warn-bg);color:var(--warn);font-weight:700}

.items{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.item.on{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.item.on.dg{border-color:var(--danger);box-shadow:inset 4px 0 0 var(--danger)}
.item .head{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer}
.item .head input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.item .head .t{flex:1;min-width:0;font-weight:700}
.item .head .hl{display:flex;gap:12px;align-items:flex-start;flex:1;min-width:0;cursor:pointer}
.rasl{display:inline-flex;align-items:center;gap:8px;flex:none;font-weight:700;color:var(--ok);border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:44px;cursor:pointer}
.rasl input{width:22px;height:22px;accent-color:var(--ok)}
.item.ras{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.item.ras .rasl{background:var(--ok-bg);border-color:var(--ok)}
button:disabled{opacity:.45;cursor:not-allowed}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ref{font-size:.75rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.body{display:grid;gap:12px;padding:0 14px 14px 50px}
.grp>span{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.dfs{display:grid;gap:6px;margin-top:6px}
.df{display:flex;gap:8px;align-items:flex-start;background:var(--chip);border-radius:8px;padding:6px 6px 6px 10px;font-size:.92rem}
.df span{flex:1;min-width:0;padding-top:6px}
.df button{min-height:34px;min-width:34px;padding:4px}
.dgl{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--danger);border:1px solid var(--danger);border-radius:8px;padding:8px 12px;cursor:pointer;justify-self:start;min-height:44px}
.dgl input{width:20px;height:20px;accent-color:var(--danger)}
.phs{display:grid;gap:10px}
.phc{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:8px}
.phc img{width:110px;height:110px;object-fit:cover;border-radius:6px;display:block}
.phc .cap{display:grid;gap:6px;min-width:0}
.phc .cap b{font-family:var(--f-display);font-size:1.05rem}
.phc textarea{min-height:64px}
.phc .tools{display:flex;justify-content:space-between;align-items:center;gap:6px}
button.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.cams{display:flex;gap:8px;flex-wrap:wrap}
.cam{border:2px dashed var(--accent);color:var(--accent);background:transparent;position:relative}
.cam input{position:absolute;opacity:0;width:1px;height:1px}
.need{color:var(--danger);font-weight:700;font-size:.85rem}

.sumtbl{display:grid;gap:8px;margin-bottom:18px}
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.sumrow .lab{font-weight:700;min-width:0}
.pad{background:var(--paper);border:1px solid var(--line);border-radius:8px;width:100%;height:150px;touch-action:none;display:block}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:9;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.item,.tile{transition:border-color .15s,box-shadow .15s}}
@media (max-width:480px){.body{padding-left:14px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.phc{grid-template-columns:84px 1fr}.phc img{width:84px;height:84px}}

/* Accueil */
.home-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding-block:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line);margin-bottom:var(--sp-5)}
.home-head .logo{height:52px;width:auto;display:block;background:#fff;border-radius:var(--r-sm);padding:4px 6px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--chip);color:var(--accent-strong);font-weight:700;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);padding:0;min-height:0}
.hello{font-size:1.5rem;font-weight:700;margin:var(--sp-1) 0 var(--sp-5)}
.big{display:flex;align-items:center;gap:var(--sp-4);width:100%;min-height:84px;padding:var(--sp-4);border-radius:14px;text-align:left;justify-content:flex-start;margin-bottom:var(--sp-3)}
.big svg.i{width:30px;height:30px}
.big .t{display:block;font-size:1.2rem;font-weight:700;line-height:1.2}
.big .d{display:block;font-size:.92rem;font-weight:400;opacity:1}
.big.primary{background:var(--accent);color:var(--accent-ink);border:0}
.big.primary .d{color:inherit}
.big.secondary{background:var(--surface);color:var(--fg);border:2px solid var(--accent)}
.big.secondary svg.i{color:var(--accent)}
.big.secondary .d{color:var(--muted)}
.big .count{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-radius:999px;font-weight:700;min-width:32px;height:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center}
.links{margin-top:var(--sp-5);border-top:1px solid var(--line)}
.links>*{display:flex;align-items:center;gap:var(--sp-3);width:100%;min-height:52px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:var(--sp-2) var(--sp-1);font-weight:400;justify-content:flex-start;color:var(--fg)}
.links>* .grow{flex:1;text-align:left}
.links svg.i{color:var(--muted)}
.offline{margin-top:var(--sp-4);font-size:.85rem;color:var(--ok);display:flex;gap:6px;align-items:center}
/* Listes de dossiers */
.case{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--sp-3) var(--sp-4);display:grid;gap:var(--sp-2)}
.case .name{font-weight:700;font-size:1.08rem}
.case .meta{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2);flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.tag{display:inline-block;justify-self:start;font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--chip);color:var(--accent-strong)}
.tag.pdl{background:var(--warn-bg);color:var(--warn)}
button:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
/* Rapport de dégradation */
.tag.deg{background:var(--ok-bg);color:var(--ok)}
.degtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.degtop .top{position:static;margin-bottom:6px;padding-block:6px}
.degtop h1{font-size:1.1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.score{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;display:grid;grid-template-columns:repeat(3,auto) 1fr;gap:4px 14px;align-items:center}
.score>div{display:flex;align-items:baseline;gap:5px}
.score .k{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.05em}
.score .v{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums}
.score .lvl{background:var(--chip);color:var(--muted);border-radius:8px;padding:4px 8px;font-weight:700;font-size:.85rem;line-height:1.2;justify-self:start}
.lvl.ok{background:var(--ok-bg);color:var(--ok)}.lvl.warn{background:var(--warn-bg);color:var(--warn)}.lvl.danger{background:var(--danger-bg);color:var(--danger)}
.score .rest{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.parts{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.parts button{min-width:52px;padding:6px 10px;gap:4px}
.parts button[aria-current]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.parts .pill{font-size:.7rem;padding:0 6px}
.el{padding:12px 14px;display:grid;gap:10px}
.el .h{display:flex;gap:8px;align-items:flex-start}
.el .h .t{flex:1;min-width:0;font-weight:700}
.el .res{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;color:var(--accent-strong)}
.el .lab{font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.el .info{font-size:.85rem;margin-top:4px}
.el .ln{display:flex;gap:14px;flex-wrap:wrap;align-items:end}
.el .ln .field{flex:1 1 150px}
.el .kval{font-weight:700;min-height:44px;display:flex;align-items:center}
.seg{display:flex;gap:6px}
.seg label.chip{flex:1;min-width:0;padding:8px 2px;justify-content:center;border-radius:10px;white-space:nowrap;min-height:44px}
.item.st0{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.item.st1{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.item.st2,.item.st3{border-color:var(--danger);box-shadow:inset 4px 0 0 var(--danger)}
.item.stSO{box-shadow:inset 4px 0 0 var(--muted)}
.item.stNV{border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn)}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.gcard .name{font-weight:700;font-size:1.05rem}
.gcard .score{border:0;padding:0}
h2.sec{margin:20px 0 8px}
@media (max-width:480px){.score{grid-template-columns:repeat(3,auto)}.score .lvl{grid-column:1/-1}}

</style>

function travaux(v){
  const L={};Object.keys(TH).forEach(k=>L[k]=[]);
  // Permis de louer : chaque correctif est remplacé par sa version avec les règles techniques.
  const tk=t=>v.type==='pdl'&&TECH[t]||t;
  const bare=l=>l.replace(/^[\s•◦]+/,'');
  const push=(th,line)=>{if(!L[th].some(l=>bare(l)===bare(line)))L[th].push(line)};
  const diag=()=>{push('regl','• Réalisation et transmission au locataire du dossier de diagnostic technique :');
    ['Diagnostic de performance énergétique (DPE)','État de l’installation intérieure d’électricité',
     ...(v.f.lAv49==='Avant 1949'?['Constat de risque d’exposition au plomb (CREP), le logement ayant été construit avant 1949']:[]),
     'État des risques et pollutions (ERP)','État de l’installation intérieure de gaz, le cas échéant','Diagnostic amiante, le cas échéant (permis de construire antérieur au 1er juillet 1997)'].forEach(x=>push('regl','   ◦ '+x))};
  for(const r of RR(v))for(const d of r.items||[]){
    const s=v.it[d.id];if(!s?.on||!d.th)continue;
    const subs=[],loc=s.loc?.trim()?`${s.loc.trim()} – `:'';
    const add=x=>{if(!x)return;if(x==='DIAG')return diag();Array.isArray(x)?subs.push({th:x[0],t:loc+tk(x[1])}):subs.push({th:d.th,t:loc+tk(x)})};
    s.o.forEach(i=>add(d.ow?.[i]));s.df.forEach(i=>add(d.df?.[i]?.[1]));(d.wx||[]).forEach(add);
    const main=subs.filter(x=>x.th===d.th);
    if(d.grp&&d.w){if(main.length){push(d.th,'• '+loc+d.w+' :');main.forEach(x=>push(d.th,'   ◦ '+x.t.slice(loc.length)))}else push(d.th,'• '+loc+tk(d.w))}
    else if(main.length)main.forEach(x=>push(d.th,'• '+x.t));
    else if(d.w)push(d.th,'• '+loc+tk(d.w));
    subs.filter(x=>x.th!==d.th).forEach(x=>push(x.th,'• '+x.t));
  }
  if(v.f.detect==='Non')push('sec','• '+tk('Installation d’au moins un détecteur autonome avertisseur de fumée (DAAF) conforme à la norme NF EN 14604'));
  return Object.entries(L).filter(([,l])=>l.length).map(([k,l])=>({title:TH[k],lines:l}));
}

function travauxTexte(v,blocks){
  const themes=blocks.map(b=>b.title.toLowerCase()).join(', ');
  const intro=v.f.cNd==='Oui'
    ?`Les désordres constatés ne permettent pas de considérer le logement comme décent. En l’état, le logement ne satisfait pas aux exigences du décret n° 2002-120 du 30 janvier 2002, notamment en matière de ${themes}.`
    :'Les travaux suivants sont préconisés pour remédier aux désordres constatés.';
  return intro+'\n\n'+blocks.map((b,i)=>`${i+1}. ${b.title}\n${b.lines.join('\n')}`).join('\n\n');
}
// Ajoute au texte existant les lignes générées manquantes, sans toucher à ce que l'utilisateur a rédigé.
function fusionTravaux(txt,blocks){
  const lines=txt.replace(/\s+$/,'').split('\n');let added=0;
  const norm=s=>s.trim();
  for(const b of blocks){
    const missing=b.lines.filter(l=>!lines.some(x=>norm(x)===norm(l)));
    if(!missing.length)continue;added+=missing.length;
    const h=lines.findIndex(x=>/^\d+\.\s/.test(x)&&x.replace(/^\d+\.\s+/,'').trim()===b.title);
    if(h<0){const n=lines.filter(x=>/^\d+\.\s/.test(x)).length+1;lines.push('',`${n}. ${b.title}`,...missing);continue}
    let end=h+1;while(end<lines.length&&!/^\d+\.\s/.test(lines[end]))end++;
    while(end>h+1&&!lines[end-1].trim())end--;
    lines.splice(end,0,...missing);
  }
  return{txt:lines.join('\n'),added};
}

function migrate(v){

  if(isPdl(v)){if(!COMMUNES[v.f.commune])v.f.commune='Thouars';if(!v.f.typeVis)v.f.typeVis=v.f.cvDateVis?'Contre-visite':'Visite de contrôle'}else if(!COM[v.f.dem])v.f.dem='CAF';
  // Code postal et ville séparés ; bât., entrée, étage et courée regroupés dans l'adresse.
  const f=v.f;if(f.cpville!==undefined){if(!f.cp&&!f.ville){const m=/^\s*(\d{5})\s*(.*)$/.exec(f.cpville);if(m){f.cp=m[1];f.ville=m[2].trim()}else f.ville=f.cpville.trim()}delete f.cpville}
  const extra=[['bat','Bât. / Rés. '],['entree','entrée '],['etage','étage '],['couree','maison n° ']].filter(([k])=>String(f[k]||'').trim()).map(([k,l])=>l+String(f[k]).trim());
  if(extra.length)f.adresse=[f.adresse,...extra].filter(x=>String(x||'').trim()).join(', ');for(const k of ['bat','entree','etage','couree'])delete f[k];
  for(const s of Object.values(v.it)){s.o=s.o||[];s.t=s.t||[];s.df=s.df||[];s.ph=(s.ph||[]).map(p=>({cap:'',...p}));s.note=s.note||'';s.loc=s.loc||''}
  // Le type de chauffage / d'eau chaude était saisi dans la pathologie : il passe dans les champs de la rubrique 4.
  // Visite antérieure à la liste de commentaires pré-rédigés : indices de l'ancienne liste de défauts types.
  if(v.dfV!==2){for(const [id,s] of Object.entries(v.it)){if(!OLD_DF[id]||!s.df.length)continue;const old=s.df.map(i=>OLD_DF[id][i]).filter(Boolean);
    if(!v.dfTxt){const add=old.filter(t=>!s.note.includes(t)).map(t=>t+'.');if(add.length)s.note=[...add,s.note].filter(x=>x.trim()).join('\n')}

  return v;
}

function field([k,label,type,opts,hint,cond]){
  if(cond&&!cond(cur))return '';
  if(k==='h')return `<h3>${esc(label)}</h3>`;
  const v=cur.f[k];const full=type==='ta'||(type==='c'||type==='r')&&opts.join('').length>40;
  let ctl;
  if(type==='r'||type==='c'){
    ctl=`<div class="chips" role="group" aria-label="${esc(label)}">${opts.map(o=>{const ch=type==='r'?v===o:(v||[]).includes(o);
      return `<label class="chip"><input type="${type==='r'?'radio':'checkbox'}" name="${k}" data-f="${k}" data-ft="${type}" value="${esc(o)}" ${ch?'checked':''}>${esc(k==='dem'?COM[o].label:o)}</label>`}).join('')}</div>`;
  }else if(type==='dl')ctl=`<input id="f_${k}" type="text" list="dl_${k}" data-f="${k}" value="${esc(v)}"><datalist id="dl_${k}">${[...new Set([...opts,...(P.ops||[])])].map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`;
  else if(type==='ta')ctl=`<textarea id="f_${k}" data-f="${k}" ${k==='trav'?'class="big"':''}>${esc(v)}</textarea>`;
  else{const t={t:'text',n:'number',d:'date',tm:'time',tel:'tel',email:'email'}[type];
    ctl=`<input id="f_${k}" type="${t}" data-f="${k}" value="${esc(v)}" ${type==='n'?'inputmode="decimal" step="any"':''}>`}
  return `<div class="field ${full?'full':''}"><span>${esc(label)}</span>${ctl}${hint?`<div class="hint">${esc(hint)}</div>`:''}</div>`;
}
function itemHtml(d,nums){
  const s=it(d.id),grp=(k,lab,arr)=>`<div class="grp"><span>${esc(lab)}</span><div class="chips">${arr.map((o,i)=>`<label class="chip"><input type="checkbox" data-it="${d.id}" data-k="${k}" data-i="${i}" ${s[k].includes(i)?'checked':''}>${esc(o)}</label>`).join('')}</div></div>`;
  let norm='';
  if(d.norm){const n=cur.f.lNbOcc,m=normeCAF(n),sf=+cur.f.lSurf;
    norm=m?`<div class="hint ${sf&&sf<m?'warn':''}">Norme CAF pour ${n} occupant${n>1?'s':''} : ${m} m² minimum. Logement : ${sf?sf+' m²':'superficie non renseignée (rubrique 1)'}${sf&&sf<m?' → sur-occupation':''}.</div>`
          :`<div class="hint">Renseignez le nombre d'occupants et la superficie en rubrique 1 pour comparer à la norme CAF (9 m² pour 1 personne, 16 m² pour 2, +9 m² par personne, 70 m² dès 8).</div>`}
  const linked=s.df.filter(i=>d.df?.[i]?.[1]);
  return `<div class="item ${s.on?'on':''} ${s.on&&s.d?'dg':''} ${s.ras?'ras':''}" id="it_${d.id}">
   <div class="head"><label class="hl"><input type="checkbox" data-it="${d.id}" data-k="on" ${s.on?'checked':''} aria-label="Défaut : ${esc(d.t)}">
    <div class="t">${esc(d.t)}<div class="meta">${d.ref?`<span class="ref">${esc(d.ref)}</span>`:''}${d.rsd?`<span class="ref">${esc(d.rsd)}</span>`:''}${d.p?`<span class="ref">Photo requise</span>`:''}${s.on&&s.ph.length?`<span class="ref">${s.ph.length} photo${s.ph.length>1?'s':''}</span>`:''}</div></div></label>
    <label class="rasl"><input type="checkbox" data-it="${d.id}" data-k="ras" ${s.ras?'checked':''} aria-label="RAS : ${esc(d.t)}">RAS</label></div>
   ${d.norm&&!s.on?`<div class="body">${norm}</div>`:''}
   ${s.on?`<div class="body">
    ${d.hint?`<div class="hint">${esc(d.hint)}</div>`:''}${norm}
    ${d.ty&&d.tl!==MEL&&!d.tf?grp('t',d.tl,d.ty):''}
    ${d.o?grp('o',d.ol||'Constat',d.o):''}
    ${d.ty&&d.tl===MEL?grp('t',d.tl,d.ty):''}
    ${d.d?`<label class="dgl"><input type="checkbox" data-it="${d.id}" data-k="d" ${s.d?'checked':''}>Danger</label>`:''}
    <label class="field"><span>Localisation (reprise dans les travaux préconisés)</span><input type="text" data-it="${d.id}" data-k="loc" value="${esc(s.loc)}" placeholder="Ex. : chambre 1, salle d’eau"></label>
    <div class="field"><span>Précisions (3) : description</span>
     ${d.df?`<select data-it="${d.id}" data-k="df" aria-label="Insérer un commentaire pré-rédigé"><option value="">+ Insérer un commentaire pré-rédigé…</option>${d.df.map((x,i)=>`<option value="${i}">${esc(x[0])}</option>`).join('')}<option value="autre">Autre (rédiger)</option></select>`:''}
     <textarea id="note_${d.id}" data-it="${d.id}" data-k="note" aria-label="Précisions" placeholder="Ex. : prise arrachée de son support (voir photo 1)">${esc(s.note)}</textarea>
     ${linked.length?`<div class="dfs"><span class="muted" style="font-size:.85rem">Correctifs liés (repris dans les travaux préconisés) :</span>${linked.map(i=>`<div class="df"><span>${esc(d.df[i][0])}</span><button type="button" data-act="deldf" data-it="${d.id}" data-i="${i}" aria-label="Retirer ce correctif">${svg('x')}</button></div>`).join('')}</div>`:''}</div>
    ${phBlock(d.id,s,nums,d.p&&!s.ph.length)}
   </div>`:''}
  </div>`;
}
function phBlock(id,s,nums,need){return `<div class="grp"><span>Photos${need?' <span class="need">— à joindre impérativement</span>':''}</span>
     <div class="phs">${s.ph.map((p,i)=>`<div class="phc"><img src="${p.src}" alt="Photo ${nums[id+':'+i]}">
       <div class="cap"><div class="tools"><b>Photo ${nums[id+':'+i]}</b><button type="button" data-act="delph" data-it="${id}" data-i="${i}">Supprimer</button></div>
       <textarea data-it="${id}" data-k="cap" data-i="${i}" placeholder="Légende : ce que montre la photo">${esc(p.cap)}</textarea></div></div>`).join('')}
      <div class="cams"><label class="btn cam">${svg('cam')}Prendre une photo<input type="file" accept="image/*" capture="environment" data-photo="${id}"></label>
      <label class="btn cam">${svg('plus')}Depuis la galerie<input type="file" accept="image/*" multiple data-photo="${id}"></label></div></div></div>`}
function topbar(title,sub,back,logo){return `<div class="top">${back?`<button class="btn-icon" data-act="${back}" aria-label="Retour">${svg('back')}</button>`:''}<div class="grow"><h1>${esc(title)}</h1>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div>${logo?`<img class="com" src="${logo}" alt="${esc(isPdl(cur)?cur.f.commune:cur.f.dem)}">`:''}</div>`}
const cpv=v=>[v.f.cp,v.f.ville].filter(Boolean).join(' ');
const who=v=>isDeg(v)?v.f.pNom||[v.f.adresse,cpv(v)].filter(Boolean).join(', ')||'Propriétaire non renseigné':isPdl(v)?[v.f.adresse,cpv(v)].filter(Boolean).join(', ')||'Logement non renseigné':[v.f.nom,v.f.prenom].filter(Boolean).join(' ')||'Occupant non renseigné';
const where=v=>isDeg(v)?[v.f.adresse,cpv(v)].filter(Boolean).join(', '):isPdl(v)?(v.f.pNom||v.f.pSoc?'Propriétaire : '+(v.f.pSoc||[v.f.pNom,v.f.pPrenom].filter(Boolean).join(' ')):''):[v.f.adresse,cpv(v)].filter(Boolean).join(', ');
const logoOf=v=>isPdl(v)?COMMUNES[v.f.commune]?.logo:COM[v.f.dem]?.logo;
const kind=v=>isDeg(v)?['Dégradation',v.bien==='imm'?`Immeuble · ${v.g.length-1} logement${v.g.length>2?'s':''}`:'Maison individuelle',v.f.op].filter(Boolean).join(' · '):isPdl(v)?'Permis de louer · '+v.f.commune+' · '+(v.f.typeVis||''):(COM[v.f.dem]?.label||'')+' · '+(v.f.typeVis||'');

// Carte d'un dossier : type, occupant ou logement, avancement, actions.
function caseHtml(v){
  const deg=isDeg(v),dr=deg?v.g.reduce((n,g)=>n+degTot(v,g).rest,0):0,rs=RR(v),fait=rs.filter(r=>rstat(r,v)[0][0]!=='À faire').length,manq=rs.reduce((n,r)=>n+(r.items||[]).filter(d=>d.p&&v.it[d.id]?.on&&!v.it[d.id].ph.length).length,0);
  return `<div class="case"><span class="tag ${isPdl(v)?'pdl':deg?'deg':''}">${esc(kind(v))}</span>
   <div><div class="name">${esc(who(v))}</div><div class="muted">${esc(where(v)||'Adresse non renseignée')}</div></div>
   <div class="meta"><span>${v.f.dateVis?'Visite le '+esc(frDate(v.f.dateVis))+' · ':''}${v.pdfAt?'Rapport du '+new Date(v.pdfAt).toLocaleDateString('fr-FR'):deg?(dr?`${dr} élément${dr>1?'s':''} à noter`:'Grille complète'):fait+'/'+rs.length+' rubriques'}${manq?` · <b style="color:var(--danger)">${manq} photo${manq>1?'s':''} manquante${manq>1?'s':''}</b>`:''}</span></div>
   <div class="row"><button class="btn-primary" data-act="open" data-id="${v.id}">${v.pdfAt?'Ouvrir':'Reprendre'}</button>
    ${v.pdfAt?`<button data-act="reopen" data-id="${v.id}">Remettre en cours</button>`:''}
    ${isPdl(v)||deg?'':`<button data-act="ctrl" data-id="${v.id}">Créer la visite de contrôle</button>`}
    <button class="btn-danger" data-act="delv" data-id="${v.id}">Supprimer</button></div></div>`;
}

      <button data-act="go" data-v="termines">${svg('archive')}<span class="grow">Dossiers terminés</span><span class="muted">${visits.length-enc}</span>${svg('chev')}</button>

      ${instEv?`<button data-act="install">${svg('inst')}<span class="grow">Installer l’application</span>${svg('chev')}</button>`:''}

     <div class="offline">${svg('ok')}Fonctionne hors ligne · données enregistrées sur cet appareil</div>`;

  if(view==='encours'||view==='termines'){
    const fin=view==='termines',L=visits.filter(v=>!!v.pdfAt===fin).sort((a,b)=>b.updated-a.updated);

     <div class="visits">${L.length?L.map(caseHtml).join('')
      :`<div class="empty"><strong>${fin?'Aucun dossier terminé.':'Aucun dossier en cours.'}</strong><br>${fin?'Un dossier passe ici dès que son rapport PDF est généré.':'Touchez « Nouvelle visite » pour démarrer un constat.'}</div>`}</div>`;
    bar.hidden=false;bi.innerHTML=`<button class="btn-primary" data-act="new">${svg('plus')}Nouvelle visite</button>`;

     <div class="hint">Pour transférer une sauvegarde vers un téléphone, utilisez Quick Share, le Bluetooth ou un câble USB, pas Outlook, Teams ni OneDrive professionnel : ces applications chiffrent le fichier, qui devient impossible à importer.</div>
     <div class="row" style="margin-bottom:12px"><button data-act="sel" data-k="all">Tout cocher</button><button data-act="sel" data-k="encours">Dossiers en cours</button><button data-act="sel" data-k="none">Tout décocher</button></div>
     <div class="items">${L.length?L.map(v=>`<label class="item ${exSel.has(v.id)?'on':''}" style="display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer">
       <input type="checkbox" data-sel="${v.id}" ${exSel.has(v.id)?'checked':''} style="width:24px;height:24px;margin:2px 0 0;accent-color:var(--accent);flex:none">
       <span style="min-width:0"><span class="tag ${isPdl(v)?'pdl':isDeg(v)?'deg':''}">${esc(kind(v))}</span><span style="display:block;font-weight:700;margin-top:4px">${esc(who(v))}</span>
       <span class="muted" style="display:block;font-size:.9rem">${esc(where(v)||'Adresse non renseignée')}${v.f.dateVis?' · visite le '+esc(frDate(v.f.dateVis)):''}${v.pdfAt?' · terminé':''}</span></span></label>`).join('')
      :'<div class="empty">Aucun dossier sur cet appareil.</div>'}</div>
     <label class="chip" style="margin-top:14px"><input type="checkbox" data-selmr ${exMairies?'checked':''}>Inclure le carnet des mairies (${Object.keys(MAIRIES.l).length})</label>
     <div class="links"><label class="btn">${svg('plus')}<span class="grow">Importer une sauvegarde</span><input type="file" accept=".json,application/json" data-import hidden></label></div>`;
    bar.hidden=false;bi.innerHTML=`<button class="btn-primary" data-act="export">${svg('pdf')}${n?`Exporter ${n} dossier${n>1?'s':''}`:'Exporter'}</button>`;

  if(view==='choose'){
    const t=(k,ic,l,d)=>`<button class="tile" data-act="newt" data-t="${k}"><img class="ic" src="${ICO[ic]}" alt=""><span class="lbl">${l}</span><span class="muted">${d}</span></button>`;

      <button class="tile" data-act="go" data-v="degbien"><img class="ic" src="${ICO.degradation}" alt=""><span class="lbl">Rapport de dégradation</span><span class="muted">Grilles Anah : maison individuelle ou immeuble collectif</span></button></div>`;

     <div class="visits">${L.length?L.map(([k,m])=>`<div class="visit"><div class="name">Mairie de ${esc(m.ville)}</div>
       <div class="form" style="margin:0">${inp(k,m,'civ','Civilité')}${inp(k,m,'adr','Adresse')}${inp(k,m,'cp','Code postal')}${inp(k,m,'mail','E-mail','email')}</div>
       <div class="row"><button class="btn-danger" data-act="delmairie" data-k="${esc(k)}">Supprimer</button></div></div>`).join('')
      :'<div class="empty">Aucune mairie enregistrée pour l’instant.</div>'}</div>`;
    bar.hidden=false;bi.innerHTML=`<button class="btn-primary" data-act="${cur?'dash':'list'}">Terminé</button>`;
    return;
  }
  if(view==='courriers'){
    const L=lettres(cur);
    app.innerHTML=`${topbar('Courriers d’information',who(cur),'dash',logoOf(cur))}
     <p class="muted">Courriers annonçant la visite au propriétaire, au locataire et à la mairie. Ils reprennent les informations administratives.</p>
     <div class="visits">${L.map(l=>`<div class="visit"><div><div class="name">${l.titre}</div>
       <div class="muted">${esc(l.dest.filter(x=>String(x||'').trim()).join(' · ')||'Destinataire non renseigné')}</div>
       <div class="muted">${l.mail?esc(l.mail):'E-mail non renseigné'}</div>
       ${l.manque.length?`<div class="hint warn" style="margin-top:6px">À compléter : ${esc(l.manque.join(', '))}</div>`:''}</div>
       <div class="row"><button data-act="lettre" data-k="${l.k}">${svg('pdf')}PDF</button><button class="btn-primary" data-act="envoi" data-k="${l.k}">Envoyer par mail</button>${l.mail?`<button data-act="copymail" data-k="${l.k}">Copier l’adresse</button>`:''}</div></div>`).join('')}</div>
     <div class="row"><button data-act="go" data-v="admin">Modifier les informations</button></div>`;
    bar.hidden=false;bi.innerHTML=`<button class="btn-primary" data-act="zipcour">${svg('pdf')}Tous les courriers (.zip)</button>`;
    return;
  }
  if(view==='profil'){
    app.innerHTML=`${topbar('Mon profil','Enregistré sur cet appareil, repris sur chaque rapport',cur?'dash':'list')}
     <div class="form">
      <div class="field"><span>Nom et prénom (rapport établi par)</span><input id="p_nom" type="text" data-p="nom" value="${esc(P.nom)}"></div>
      <div class="field"><span>Qualité (ex. : technicien habitat)</span><input id="p_qual" type="text" data-p="qual" value="${esc(P.qual)}"></div>
      <div class="field"><span>Téléphone</span><input id="p_tel" type="tel" data-p="tel" value="${esc(P.tel)}"></div>

      <div class="field full"><span>Signature : signez au doigt ou importez une image scannée</span><canvas class="pad" id="pad" aria-label="Zone de signature de l'enquêteur"></canvas>
       <div class="row"><button data-act="clrpsig">Effacer</button><label class="btn">Importer une image<input type="file" accept="image/*" data-psig hidden></label></div></div>
     </div>`;
    initPad(P.sig?.src,(src,r)=>{P.sig={src,r};saveP()});
    bar.hidden=false;bi.innerHTML=`<button class="btn-primary" data-act="${cur?'dash':'list'}">Terminé</button>`;
    return;

  if(isDeg(cur)&&degView(app,bar,bi))return;
  const logo=logoOf(cur),RV=RR(cur),pdl=isPdl(cur);
  if(view==='dash'){
    const tile=(id,n,t,ic,st)=>`<button class="tile" data-act="go" data-v="${id}"><img class="ic" src="${ICO[ic]}" alt=""><span class="num">${n}</span><span class="lbl">${esc(t)}</span>${pills(st)}</button>`;
    const aN=ADM(cur).filter(f=>f[0]!=='h'&&filled(cur.f[f[0]])).length;
    app.innerHTML=`${topbar(who(cur),[cur.f.typeVis,where(cur)].filter(Boolean).join(' · '),'list',logo)}
     <div class="tiles">
      ${tile('admin','INFOS','Informations administratives','admin',[[aN?`${aN} champs`:'À faire',aN?'info':'']])}
      ${pdl?'':tile('courriers','AVANT LA VISITE','Courriers d’information','courrier',[[(n=>n?`${n} à compléter`:'Prêts')(lettres(cur).filter(l=>l.manque.length).length),lettres(cur).some(l=>l.manque.length)?'warn':'ok']])}
      ${RV.map(r=>tile(r.id,'RUBRIQUE '+r.n,r.t,r.ic,rstat(r))).join('')}
      ${pdl?tile('synth','SYNTHÈSE','Résumé et commentaires','comm',[[cur.f.etat?'État : '+cur.f.etat:'À faire',{Bon:'ok',Passable:'warn',Mauvais:'danger'}[cur.f.etat]||'']])
       :tile('synth','CONCLUSION','Synthèse et signature','synth',[[cur.f.cNd?'Non-décence : '+cur.f.cNd:'À faire',cur.f.cNd==='Oui'?'danger':cur.f.cNd?'ok':'']])}
     </div>`;
    bar.hidden=false;bi.innerHTML=`<button data-act="zipph">${svg('cam')}Exporter les photos</button><button class="btn-primary" data-act="pdf">${svg('pdf')}Générer le rapport PDF</button>`;

  if(view==='admin'){
    app.innerHTML=`${topbar('Informations administratives',who(cur),'dash',logo)}<div class="form">${ADM(cur).map(field).join('')}</div>`;
    bar.hidden=false;bi.innerHTML=`<button class="btn-primary" data-act="dash">${isDeg(cur)?'Continuer vers la grille':'Continuer vers les rubriques'}</button>`;
    return;
  }
  if(view==='synth'){

/* ---------- signature ---------- */
function initPad(src,done){
  const c=$('#pad');if(!c)return;const dpr=devicePixelRatio||1;c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;
  const g=c.getContext('2d');g.scale(dpr,dpr);g.lineWidth=2.2;g.lineCap='round';g.lineJoin='round';g.strokeStyle=getComputedStyle(c).getPropertyValue('--ink')||'#111';
  if(src){const im=new Image();im.onload=()=>{const k=Math.min(c.clientWidth/im.naturalWidth,c.clientHeight/im.naturalHeight),w=im.naturalWidth*k,h=im.naturalHeight*k;g.drawImage(im,(c.clientWidth-w)/2,(c.clientHeight-h)/2,w,h)};im.src=src}
  let drawing=false;const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);g.beginPath();g.moveTo(...pt(e))};
  c.onpointermove=e=>{if(!drawing)return;g.lineTo(...pt(e));g.stroke()};
  c.onpointerup=c.onpointercancel=()=>{if(!drawing)return;drawing=false;done(c.toDataURL('image/png'),c.clientHeight/c.clientWidth)};
}

/* ---------- photos ---------- */
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('image illisible'));im.src=src})}
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{const im=await loadImg(url);const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
    const w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k);const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(im,0,0,w,h);return{src:c.toDataURL('image/jpeg',.72),w,h,cap:''}}
  finally{URL.revokeObjectURL(url)}
}

const keep=()=>{const y=scrollY;render();scrollTo(0,y)};
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.p){P[el.dataset.p]=el.value.trim();saveP();return}
  if(el.dataset.mr){const m=MAIRIES.l[el.dataset.mr];if(m){m[el.dataset.mk]=el.value;m.maj=today();saveMairies()}return}
  if(!cur)return;
  if(el.dataset.gn==='pt'||el.dataset.gn==='motif'){const s=degS(el);s[el.dataset.gn]=el.value;save();return}
  if(el.dataset.f&&!el.dataset.ft){cur.f[el.dataset.f]=el.value;save();if(/^mr/.test(el.dataset.f))memoMairie(cur);return}
  if(el.dataset.it&&(el.dataset.k==='note'||el.dataset.k==='loc')){it(el.dataset.it)[el.dataset.k]=el.value;save()}
  if(el.dataset.it&&el.dataset.k==='cap'){it(el.dataset.it).ph[+el.dataset.i].cap=el.value;save()}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset.import!==undefined)return importJson(el);
  if(el.dataset.sel){el.checked?exSel.add(el.dataset.sel):exSel.delete(el.dataset.sel);return keep()}
  if(el.dataset.selmr!==undefined){exMairies=el.checked;return}

  if(!cur)return;
  if(el.dataset.gn==='h'||el.dataset.gn==='a'){const s=degS(el),x=el.value;if(el.dataset.gn==='h')s.h=x==='SO'||x==='NV'?x:+x;else s.a=x===''?null:+x;save();return keep()}
  if(el.dataset.gn==='pt')return keep();
  // Opération : la dernière saisie est proposée par défaut et ajoutée à la liste.
  if(el.dataset.f==='op'){const o=el.value.trim();P.lastOp=o;if(o&&!OPERATIONS.includes(o))P.ops=[...new Set([...(P.ops||[]),o])];saveP();return}

    if(el.dataset.f!=='mrVille'&&!f.mrAdr&&!f.mrMail){f.mrVille=f.ville||'';f.mrCp=f.cp||''}
    const rep=repriseMairie(cur);save();
    // Réaffiche sans perdre le champ en cours de saisie.
    if(rep||avant!==f.mrVille+'|'+f.mrCp){const id=document.activeElement?.id;keep();if(id)$('#'+id)?.focus()}return}
  if(el.dataset.ft==='r'){cur.f[el.dataset.f]=el.value;if(el.dataset.f==='mrCiv')memoMairie(cur);
    if(el.dataset.f==='commune'&&(!cur.f.cp||Object.values(COMMUNES).some(c=>c.cp===cur.f.cp))){cur.f.cp=COMMUNES[el.value].cp;cur.f.ville=COMMUNES[el.value].ville}
    save();keep();return}
  if(el.dataset.ft==='c'){const k=el.dataset.f,no=x=>/^Aucune?$/.test(x);let a=(cur.f[k]||[]).filter(x=>x!==el.value);
    if(el.checked){a=no(el.value)?[]:a.filter(x=>!no(x));a.push(el.value)}cur.f[k]=a;save();return keep()}
  if(el.dataset.it&&el.dataset.k){
    const s=it(el.dataset.it),k=el.dataset.k;
    if(k==='on'||k==='d'||k==='ras'){s[k]=el.checked;if(el.checked&&k!=='d')s[k==='on'?'ras':'on']=false;save();return keep()}
    if(k==='df'){const v=el.value;el.value='';if(v==='')return;const ta=$('#note_'+el.dataset.it);
      if(v!=='autre'){const i=+v,t=itemOf(el.dataset.it).df[i][0];if(!s.df.includes(i))s.df.push(i);
        s.note=(s.note.trim()?s.note.replace(/\s+$/,'')+'\n':'')+t+(/[.!?]$/.test(t)?'':'.');ta.value=s.note;save()}
      ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);return}
    if(k==='o'||k==='t'){const i=+el.dataset.i;s[k]=s[k].filter(x=>x!==i);if(el.checked)s[k].push(i);s[k].sort((a,b)=>a-b);save();return}
  }
  if(el.dataset.photo){
    const s=it(el.dataset.photo),files=[...el.files];el.value='';
    for(const f of files){try{s.ph.push(await shrink(f))}catch(err){toast('Photo non ajoutée : '+err.message)}}
    await save(true);keep();toast(files.length>1?files.length+' photos ajoutées':'Photo ajoutée');
  }
});

async function offer(filename,blob){

  if(dl){try{await dl.save({filename,data:blob});toast('Fichier enregistré')}catch(e){if(e.code!=='declined')toast('Enregistrement impossible ('+(e.code||e.message)+')')}return}

// Archive .zip sans compression (les JPEG sont déjà compressés) : à l'ouverture, le téléphone en fait un dossier.
const CRC=new Uint32Array(256).map((_,n)=>{let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0});
const crc32=b=>{let c=~0;for(const x of b)c=CRC[(c^x)&255]^(c>>>8);return ~c>>>0};
function zip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const d=new Date(),time=d.getHours()<<11|d.getMinutes()<<5|d.getSeconds()>>1,date=d.getFullYear()-1980<<9|d.getMonth()+1<<5|d.getDate();
  for(const f of files){
    const name=enc.encode(f.name),crc=crc32(f.data),n=f.data.length;
    const head=(sig,extra)=>{const h=new DataView(new ArrayBuffer(extra?46:30));let p=0;const u16=v=>{h.setUint16(p,v,true);p+=2},u32=v=>{h.setUint32(p,v,true);p+=4};
      u32(sig);if(extra)u16(20);u16(20);u16(0x0800);u16(0);u16(time);u16(date);u32(crc);u32(n);u32(n);u16(name.length);u16(0);
      if(extra){u16(0);u16(0);u16(0);u32(0);u32(off)}return new Uint8Array(h.buffer)};
    cd.push(head(0x02014b50,1),name);parts.push(head(0x04034b50),name,f.data);off+=30+name.length+n;
  }
  const cdSize=cd.reduce((a,b)=>a+b.length,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,end],{type:'application/zip'});
}

  row([[cbs(yn(f.lBail,1),{pre:'Bail écrit :'}),cbs(yn(f.lEdl,1),{pre:'État des lieux d’entrée :'}),rt([['(si oui, que révèle-t-il sur l’état du logement ?) : '],[f.lEdlP,1]],{i:1})]],[CW]);
  row([[rt([["Nombre d'occupants : "],[f.lNbOcc,1]])],[rt([['Adultes (indiquer les âges) : '],[f.lAdultes,1]])],[rt([['Enfants (indiquer les âges) : '],[f.lEnfants,1]])]],[50,68,68]);
  y+=3;
  row([LB(['Personnes présentes lors de l’enquête',tx('(Nom, prénom, qualité)',{i:1,sz:7.5,c:MUT})]),[tx(f.lPresents||'',{b:1})]],[38,148]);
  y+=4;

  }
  /* --- rubriques 2 à 6 --- */
  const IW=[54,26,90,16],NOTE={2:'2 : Pièce principale = Chambre, séjour, Salon, Salle à manger ; S > 9 m² dans une pièce min, > 7 m² dans les suivantes, H > 2,20 m',
    3:'3 : Préciser : localisation, description : joindre impérativement des photos',
    4:'4 : Obligatoire pour tout logement d’avant 1949 mis en location après le 12 août 2008',
    5:'5 : Pièce par pièce : 2 ventilations (haute et basse) ou une ventilation haute et un ouvrant sur l’extérieur (WC et salle de bain)',
    6:'6 : Balayage : arrivée air neuf dans les pièces principales et sortie air vicié par les pièces de service (WC, salle de bain, cuisine)',
    7:'7 : Normes CAF : 09 m² de surface habitable pour 1 personne isolée ; 16 m² pour 2 personnes ; + 9 m² par personne supplémentaire ; au moins 70 m² pour 8 personnes et plus'};
  const notes=ns=>{y+=1;flow(ns.map(n=>tx(NOTE[n],{sz:7,c:MUT})));y+=5};
  for(const r of RR(v).filter(r=>r.items)){
    need(40);const nums=phNums(r,v);
    row([HD(`${r.n} · ${r.pt}`,{ic:ICP[r.ic]}),{items:r.nod&&!pdl?[]:[tx('Danger',{b:1,al:'center',sz:8,c:WHITE})],fill:ACC,va:'middle'}],[170,16]);
    if(pdl)row([LB('Pas de désordres constatés'),[cb(r.items.every(d=>v.it[d.id]?.ras),'',{cc:OK})]],[170,16]);
    for(const d of r.items){
      const s=v.it[d.id]||{on:false,o:[],t:[],df:[],note:'',d:false,ph:[]};
      const c1=[cb(s.on,d.t,{b:1,c:s.on?INK:MUT,cc:RED})],c3=[];
      if(d.ty&&d.tl!==MEL){c1.push(gap(1),tx(d.tl+' :',{i:1,sz:8}));d.ty.forEach((x,i)=>c1.push(cb(d.tf?(f[d.tf]||[]).includes(x):s.t.includes(i),x,{ind:2})))}
      if(d.o){if(d.ol)c3.push(tx(d.ol+' :',{i:1}));d.o.forEach((x,i)=>c3.push(cb(s.o.includes(i),x,{cc:RED})))}
      if(d.ty&&d.tl===MEL){c3.push(gap(1),tx(d.tl+' :',{i:1}));d.ty.forEach((x,i)=>c3.push(cb(s.t.includes(i),x)))}
      if(d.norm&&s.on){const m=normeCAF(f.lNbOcc);if(m)c3.push(tx(`Norme CAF pour ${f.lNbOcc} occupant(s) : ${m} m² minimum. Superficie : ${f.lSurf||'non renseignée'} m².`))}
      if(c3.length)c3.push(gap(1));
      c3.push(rt([['(3) '],[s.on?[s.loc,s.note].filter(Boolean).join(' - '):'',1]],{c:RED}));
      if(s.on)s.ph.forEach((p,i)=>{c3.push(gap(1),img(p.src,p.w,p.h,{maxH:62}),rt([[`Photo ${nums[d.id+':'+i]}${p.cap?' : ':''}`],[p.cap,1]],{sz:8,c:MUT}))});
      row([s.on?{items:c1,fill:ROSE}:c1,[tx(d.ref||'',{sz:7.5,c:MUT}),...(d.rsd?[gap(1),tx(d.rsd,{sz:7.5,c:MUT})]:[])],c3,d.d?{items:[cb(s.on&&s.d,'',{cc:RED})],va:'middle'}:[]],IW,{keep:70});
    }
    if(r.id==='r4')row([[tx('Installation de détecteur de fumée :',{b:1}),cbs(yn(f.detect))],[tx('CCH art. R.142-2',{sz:7.5,c:MUT})],[rt([['Nombre de détecteur de fumée : '],[f.detectNb,1]])],[]],IW);
    notes(r.id==='r3'?[2,3]:r.id==='r6'?(pdl?[3,4,5,6]:[3,4,5,6,7]):[3]);
  }
  // La phrase fixe des justificatifs s'insère avant la première catégorie de travaux (ou après le premier paragraphe).
  const travLines=t=>{const L=String(t||'').split('\n');if(String(t||'').trim()){let i=L.findIndex(l=>/^\d+\.\s/.test(l));if(i<0)i=L.findIndex(l=>!l.trim());if(i<0)i=L.length;L.splice(i,0,'\u0000'+justifTexte(v),'')}
    return L.map(l=>l.startsWith('\u0000')?tx(l.slice(1)):/^\d+\.\s/.test(l)?tx(l,{b:1,sz:9.5,c:ACC}):/^\s*◦/.test(l)?tx('-  '+l.replace(/^\s*◦\s*/,''),{ind:9}):/^\s*•/.test(l)?tx(l.trim(),{ind:3}):l.trim()?tx(l):gap(1.5))};
  if(pdl){
  /* --- permis de louer : travaux, contre-visite, signatures --- */
  need(40);
  row([HD('7 · '+R_PDL[6].pt,{ic:ICP.trav})],[CW]);
  row([travLines(f.trav)],[CW],{minH:40});
  if(cv){
  y+=4;need(60);
  row([HD('8 · CONTRE-VISITE',{ic:ICP.synth})],[CW]);
  row([LB(`Travaux prescrits dans l’arrêté ${cm.arr} en date du ${frDate(f.cvArrete)||'..................'}`,{va:'top'}),LB('Travaux réalisés par le propriétaire',{va:'top'})],[93,93]);
  row([[tx(f.cvPresc||'',{b:1})],[tx(f.cvReal||'',{b:1})]],[93,93],{minH:24});
  const n8=phNums(R_PDL[7],v),ph8=(v.it.r8ph?.ph||[]).flatMap((p,i)=>[gap(1),img(p.src,p.w,p.h,{maxH:62}),rt([[`Photo ${n8['r8ph:'+i]}${p.cap?' : ':''}`],[p.cap,1]],{sz:8,c:MUT})]);
  row([[tx(`Les travaux réalisés par le propriétaire permettent-ils de lever les réserves prescrites dans l’arrêté ${cm.arr} en date du ${frDate(f.cvArrete)||'..................'} ?`),cbs([[f.cvLeve==='Oui','Oui',OK],[f.cvLeve==='Non','Non',RED]]),gap(1),
        rt([['Si non, quels sont les travaux non effectués qui doivent être réalisés ? '],[f.cvLeve==='Oui'?'':f.cvReste,1]]),...ph8]],[CW]);
  }
  y+=4;need(56);
  row([LB('Bailleur ou mandataire (nom de l’agence et nom - prénom du référent)'),[tx([f.mAg,[f.mNom,f.mPrenom].filter(Boolean).join(' ')].filter(Boolean).join(' - ')||[f.pSoc,[f.pNom,f.pPrenom].filter(Boolean).join(' ')].filter(Boolean).join(' - '),{b:1})]],[70,116]);
  y+=3;
  // Une ligne de signatures par visite : enquêteur et propriétaire (ou son représentant).
  const sig=(sg,nom,d)=>[...(sg?[img(sg.src,100,100*sg.r,{maxW:50,maxH:24})]:[gap(24)]),tx(`${nom||''}${d?' - le '+frDate(d):''}`,{al:'center',sz:8,c:MUT})];
  const sigRow=(t,d,k)=>{need(46);row([LB(`Signatures - ${t}`)],[CW]);
    row([[tx('Enquêteur',{b:1,sz:7.5,c:ACC}),...sig(P.sig,P.nom,d)],[tx('Propriétaire ou son représentant',{b:1,sz:7.5,c:ACC}),...sig(f[k],f[k+'Nom'],f[k]?d:'')]],[93,93],{minH:34})};
  sigRow('Visite de contrôle',f.dateVis,'sigP');
  if(cv){y+=2;sigRow('Contre-visite',f.cvDateVis,'sigPcv')}
  y+=3;flow([tx(ORTHI,{sz:7,c:MUT})]);
  }else{
  /* --- rubriques 7 et 8 --- */
  need(40);
  row([HD('7 · COMMENTAIRES',{ic:ICP.comm,sub:'Recueil des observations des personnes habitant le logement, du bailleur ou de son représentant et si besoin du syndic de la copropriété'})],[CW]);
  const n7=phNums(R[6],v),ph7=(v.it.r7ph?.ph||[]).flatMap((p,i)=>[gap(1),img(p.src,p.w,p.h,{maxH:62}),tx(`Photo ${n7['r7ph:'+i]}${p.cap?' : '+p.cap:''}`,{sz:8,c:MUT})]);
  row([[tx(f.comm||''),...ph7]],[CW],{minH:30});
  if(isCAF(v)){y+=2;flow([tx(ORTHI,{sz:7,c:MUT})])}
  newPage();
  row([HD('8 · '+R[7].pt,{ic:ICP.trav})],[CW]);
  row([travLines(f.trav)],[CW],{minH:40});
  const rap=[...(f.rap||[]),...(filled(f.rapAutre)?[f.rapAutre]:[])];
  if(rap.length){y+=4;need(30);row([HD('RAPPELS AUX OCCUPANTS',{ic:ICP.rappel})],[CW]);row([rap.map(x=>tx('• '+x,{ind:1}))],[CW])}
  }

  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setDrawColor(...ACC);doc.setLineWidth(.4);doc.line(M,H-10,W-M,H-10);font(7.5,'normal',MUT);doc.text(T(`${pdl?cm.foot:'Constat Décence '+com.foot} / SOLIHA Charente-Maritime Deux-Sèvres`),M,H-6.5);font(7.5,'bold',ACC);doc.text(`Page ${i} / ${n}`,W-M,H-6.5,{align:'right'})}
  await offer(pdl?`Permis_de_louer_${slug(f.adresse)||'logement'}_${f.dateVis||today()}.pdf`:`Constat_decence_${slug(f.nom)||'logement'}_${f.dateVis||today()}.pdf`,doc.output('blob'));
}

/* ---------- démarrage ---------- */
(async()=>{
  if(!await store.open()){const b=$('#banner');b.hidden=false;b.textContent="Stockage indisponible sur ce navigateur : les visites seront perdues à la fermeture. Exportez une sauvegarde ou le PDF avant de quitter."}
  try{visits=(await store.all()).map(migrate)}catch(e){visits=[]}
  try{P=await store.getProfil()}catch(e){}
  try{MAIRIES=await store.getRec('mairies');MAIRIES.l=MAIRIES.l||{}}catch(e){}
  render();
  try{await navigator.storage?.persist?.()}catch(e){}
  // Mode hors ligne : le service worker garde l'application en cache (impossible si le fichier est ouvert en local).
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
